
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Student Portal | Login</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #092b50, #1767a5);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: white;
            padding: 18px;
            text-align: center;
            color: #123c69;
        }

        header h1 {
            margin: 0;
            font-size: 25px;
        }

        header p {
            margin: 6px 0 0;
            color: #555;
        }

        .login-container {
            background: white;
            width: 90%;
            max-width: 420px;
            margin: 55px auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            box-sizing: border-box;
        }

        .login-container h2 {
            text-align: center;
            color: #123c69;
            margin-bottom: 8px;
        }

        .welcome {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .login-container input {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }

        .login-container button {
            width: 100%;
            padding: 13px;
            background: #123c69;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 12px;
        }

        .login-container button:hover {
            background: #1767a5;
        }

        .forgot {
            text-align: right;
            margin: 8px 0;
        }

        .login-container a {
            color: #1767a5;
            text-decoration: none;
        }

        .login-container a:hover {
            text-decoration: underline;
        }

        .register {
            text-align: center;
            margin-top: 20px;
        }

        footer {
            background: #082342;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: auto;
        }

        @media (max-width: 480px) {
            .login-container {
                margin: 30px auto;
                padding: 22px;
            }

            header h1 {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>UNIVERSITY STUDENT PORTAL</h1>
        <p>Learn • Grow • Succeed</p>
    </header>

    <div class="login-container">

        <h2>Student Login</h2>

        <p class="welcome">
            Welcome back! Please login to continue.
        </p>

        <form action="/login" method="POST">

            <input
                type="text"
                name="reg_number"
                placeholder="Registration Number"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <div class="forgot">
                <a href="forgot-password.html">
                    Forgot Password?
                </a>
            </div>

            <button type="submit">
                Login
            </button>

        </form>

        <div class="register">
            <p>Don't have an account?</p>

            <a href="register.html">
                Create Student Account
            </a>
        </div>

    </div>

    <footer>
        <p>&copy; 2026 University Student Portal.</p>
        <p>All Rights Reserved.</p>
    </footer>

</body>
</html>
